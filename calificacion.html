<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calificar tutoría · TutoresOn-Line</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="buscar.html"><span class="logo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 4 2 9l10 5 10-5-10-5z" fill="#1c3336"/><path d="M6 12v4c0 1.5 3 3 6 3s6-1.5 6-3v-4l-6 3-6-3z" fill="#1c3336"/></svg></span>TutoresOn-Line</a>
    <nav aria-label="Principal">
      <a href="buscar.html">Buscar</a>
      <a href="mis-tutorias.html" aria-current="page">Mis tutorías</a>
      <a href="login.html">Salir</a>
    </nav>
  </div>
</header>

<main>
<div class="card">
  <h1>Tutoría con Laura Méndez</h1>
  <div class="video" role="img" aria-label="Espacio de la videollamada">
    <p>Aquí irá la videollamada</p>
    <div class="yo"></div>
  </div>

  <form data-destino="resenas.html">
    <h2 id="t-calif">Al finalizar: califica esta tutoría</h2>
    <div class="calif" role="radiogroup" aria-labelledby="t-calif">
      <input type="radio" name="estrellas" id="e5" value="5" required>
      <label for="e5"><span class="sr">5 estrellas</span>★</label>
      <input type="radio" name="estrellas" id="e4" value="4">
      <label for="e4"><span class="sr">4 estrellas</span>★</label>
      <input type="radio" name="estrellas" id="e3" value="3">
      <label for="e3"><span class="sr">3 estrellas</span>★</label>
      <input type="radio" name="estrellas" id="e2" value="2">
      <label for="e2"><span class="sr">2 estrellas</span>★</label>
      <input type="radio" name="estrellas" id="e1" value="1">
      <label for="e1"><span class="sr">1 estrella</span>★</label>
    </div>
    <label class="sr" for="comentario">Comentario opcional</label>
    <input type="text" id="comentario" name="comentario" placeholder="Comentario opcional...">

    <div class="ia">
      <b>Resumen generado con IA</b>
      Se repasaron derivadas e integrales básicas; se recomienda practicar la regla de la cadena antes de la próxima sesión.
    </div>
    <button class="btn" type="submit">Enviar calificación</button>
  </form>
</div>
</main>

<script src="js/app.js"></script>
</body>
</html>
