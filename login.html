<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · TutoresOn-Line</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="login.html"><span class="logo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 4 2 9l10 5 10-5-10-5z" fill="#1c3336"/><path d="M6 12v4c0 1.5 3 3 6 3s6-1.5 6-3v-4l-6 3-6-3z" fill="#1c3336"/></svg></span>TutoresOn-Line</a>
  </div>
</header>

<main>
<div class="card narrow">
  <h1>Ingresa a tu cuenta</h1>
  <form data-destino="buscar.html" data-destino-tutor="panel-tutor.html">
    <div class="seg" role="radiogroup" aria-label="Tipo de cuenta">
      <input type="radio" name="rol" id="rol-estudiante" value="estudiante" checked>
      <label for="rol-estudiante">Soy estudiante</label>
      <input type="radio" name="rol" id="rol-tutor" value="tutor">
      <label for="rol-tutor">Soy tutor</label>
    </div>
    <label class="sr" for="correo">Correo electrónico</label>
    <input type="email" id="correo" name="correo" placeholder="Correo electrónico" autocomplete="email" required>
    <label class="sr" for="clave">Contraseña</label>
    <input type="password" id="clave" name="clave" placeholder="Contraseña" autocomplete="current-password" required>
    <button class="btn" type="submit">Iniciar sesión</button>
  </form>
  <p class="aparte">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
</div>
</main>

<script src="js/app.js"></script>
</body>
</html>
