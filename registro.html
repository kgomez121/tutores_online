<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta · TutoresOn-Line</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="login.html"><span class="logo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 4 2 9l10 5 10-5-10-5z" fill="#1c3336"/><path d="M6 12v4c0 1.5 3 3 6 3s6-1.5 6-3v-4l-6 3-6-3z" fill="#1c3336"/></svg></span>TutoresOn-Line</a>
  </div>
</header>

<main>
<div class="card narrow">
  <h1>Crea tu cuenta</h1>
  <form data-destino="login.html">
    <div class="seg oscuro" role="radiogroup" aria-label="Tipo de cuenta">
      <input type="radio" name="rol" id="rol-estudiante" value="estudiante" checked>
      <label for="rol-estudiante">Soy estudiante</label>
      <input type="radio" name="rol" id="rol-tutor" value="tutor">
      <label for="rol-tutor">Soy tutor</label>
    </div>
    <label class="sr" for="nombre">Nombre completo</label>
    <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" autocomplete="name" required>
    <label class="sr" for="correo">Correo electrónico</label>
    <input type="email" id="correo" name="correo" placeholder="Correo electrónico" autocomplete="email" required>
    <label class="sr" for="clave">Contraseña</label>
    <input type="password" id="clave" name="clave" placeholder="Contraseña (mínimo 6 caracteres)" minlength="6" autocomplete="new-password" required>

    <!-- Estos dos campos solo se ven cuando se elige "Soy tutor" -->
    <div class="solo-tutor">
      <label class="sr" for="materias">Materias que dictas</label>
      <input type="text" id="materias" name="materias" placeholder="Materias que dictas (ej. Matemáticas, Física)">
      <label class="sr" for="tarifa">Tarifa por hora</label>
      <input type="number" id="tarifa" name="tarifa" min="0" step="1000" placeholder="Tarifa por hora (COP)">
    </div>

    <button class="btn" type="submit">Crear cuenta</button>
  </form>
  <p class="aparte">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
</div>
</main>

<script src="js/app.js"></script>
</body>
</html>
